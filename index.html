<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<title>WebGIS 3D Kabupaten Cianjur</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9efe5;--ink:#1d2b27;--mut:#5b6b64;--pn:#f6f8f3;--ln:#c7d3c6;--ac:#d4452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201c;--ink:#e4ece6;--mut:#94a69c;--pn:#1c2b26;--ln:#2e4139}}
:root[data-theme="dark"]{--bg:#14201c;--ink:#e4ece6;--mut:#94a69c;--pn:#1c2b26;--ln:#2e4139}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Bricolage Grotesque",system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,30vw,400px);overflow:hidden}
#map{position:relative;min-height:0;touch-action:none;cursor:grab;overflow:hidden}
#map canvas{display:block;width:100%;height:100%}
h1{position:absolute;left:16px;top:12px;margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;pointer-events:none}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.lb{position:absolute;font-size:10px;font-weight:600;pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 5px var(--bg);white-space:nowrap}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:4px;font-size:12px;display:none}
.bar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.bar button,.bar select,.pill{font:inherit;font-size:12px;background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:5px 9px;cursor:pointer}
.bar button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bot{position:absolute;left:16px;bottom:12px;right:12px;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--mut);flex-wrap:wrap;pointer-events:none}
.bot>*{pointer-events:auto}.bot input[type=range]{width:80px}
.leg{display:flex;align-items:center;gap:6px}.leg i{width:100px;height:8px;border-radius:4px;background:linear-gradient(90deg,#e4d49a,#4f9a68,#1c4a3a)}
aside{background:var(--pn);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#info{padding:16px 18px;border-bottom:1px solid var(--ln);overflow:auto;max-height:56%}
#info h2{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.zone{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);margin:0 4px 10px 0}
dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:4px 10px}dt{color:var(--mut)}dd{margin:0}
.note{margin-top:8px;font-size:12px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chips button{font:inherit;font-size:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:99px;padding:1px 9px;cursor:pointer}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
td,th{padding:2px 8px 2px 0;font-size:13px}textarea{width:100%;height:70px;margin-top:6px;font:11px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:5px}
#q{margin:12px 18px 8px;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#list{overflow:auto;padding:0 10px 14px;flex:1}
#list button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:5px 8px;border-radius:5px;cursor:pointer}
#list button:hover{background:var(--bg)}#list button.on{background:var(--ac);color:#fff}#list span{opacity:.6;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
@supports(height:100dvh){html,body{height:100dvh}}
#map{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}#q{font-size:16px}
.rk{display:grid;grid-template-columns:104px 1fr 52px;align-items:center;gap:6px;cursor:pointer;font-size:12px;padding:2px 0}.rk i{height:7px;background:var(--ac);border-radius:4px;opacity:.75}.rk b{font-weight:600;text-align:right}
#hd,#bo{display:none}#opt{display:contents}
@media(max-width:900px){
body{display:block}#map{position:fixed;inset:0}
h1{font-size:17px;left:10px;top:8px}h1 small{font-size:10px}
.bar{flex-direction:row;left:8px;right:8px;top:46px;overflow-x:auto;justify-content:flex-start;align-items:center;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch}.bar::-webkit-scrollbar{display:none}.bar>*{flex:none}
.bar button,.bar select{min-height:36px;font-size:13px;padding:6px 11px}#bo{display:inline-block}
aside{position:fixed;left:0;right:0;bottom:0;height:50vh;border:0;border-top:1px solid var(--ln);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.22);transform:translateY(calc(100% - 54px));transition:transform .25s ease;z-index:5}
aside.open{transform:none}
#hd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:54px;flex:none;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
#hd::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--ln)}
#info{max-height:46%;padding:10px 14px}#q{margin:8px 14px}
.bot{left:8px;right:8px;bottom:calc(62px + env(safe-area-inset-bottom,0px));gap:8px;font-size:11px}body.so .bot{bottom:calc(50vh + 8px)}
#opt{display:none;position:fixed;left:8px;right:8px;top:92px;z-index:7;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;grid-template-columns:1fr 1fr;gap:12px;font-size:14px;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.28)}
#opt.show{display:grid}#opt label{display:flex;flex-direction:column;gap:4px}#opt label.ck{flex-direction:row;align-items:center;gap:8px}#opt input[type=range]{width:100%}#opt select{min-height:36px;font-size:14px}
#list button{min-height:42px}.chips button{min-height:32px}.leg i{width:56px}
}
@supports(height:100dvh){@media(max-width:900px){aside{height:50dvh}body.so .bot{bottom:calc(50dvh + 8px)}}}
footer{padding:8px 14px;border-top:1px solid var(--ln);font-size:12px;color:var(--mut);text-align:center;padding-bottom:max(8px,env(safe-area-inset-bottom))}footer b{color:var(--ink)}
@media(max-height:480px) and (orientation:landscape){body{display:grid;grid-template-columns:minmax(0,1fr) 270px}#map{position:relative;inset:auto}aside{position:static;height:auto;transform:none;border-radius:0;box-shadow:none;border-top:0;border-left:1px solid var(--ln)}#hd,#bo{display:none}h1{font-size:15px}h1 small{display:none}.bar{top:34px}.bot,body.so .bot{bottom:8px}#opt{display:contents}#info{max-height:50%}}
</style></head><body>
<div id="map"><h1>Cianjur 3D<small>32 kecamatan · 360 desa · batas Kepmendagri 2025</small></h1><div id="tip"></div>
<div class="bar"><button id="bo">⚙ Opsi</button><select id="mt" aria-label="Metrik tinggi dan warna"></select>
<button id="bp">Bandingkan</button><button id="bm">Ukur jarak</button><button id="bc">Hapus ukur</button><button id="bu">Tur</button><button id="bl">Lokasiku</button><button id="bh">Tema</button><button id="bt">Tampilan atas</button><button id="br">Reset</button><button id="bx">GeoJSON</button></div>
<div class="bot"><div id="opt"><label>Relief <input id="ex" type="range" min=".3" max="3" step=".1" value="1"></label><label>Pisah <input id="xp" type="range" min="0" max="1" step=".05" value="0"></label><label class="ck"><input id="wt" type="checkbox" checked> Wisata</label><select id="wf" aria-label="Filter wisata"><option value="*">Semua jenis</option><option>Alam</option><option>Budaya</option><option>Pantai</option><option>Kota</option></select><label class="ck"><input id="lbt" type="checkbox" checked> Label</label><label class="ck"><input id="dst" type="checkbox" checked> Batas desa</label></div><span class="leg"><span id="lmin"></span><i></i><span id="lmax"></span></span><span id="cur" class="pill" style="cursor:default">Ketuk wilayah untuk detail</span></div></div>
<aside><button id="hd">Info & daftar wilayah</button><div id="info"></div><input id="q" placeholder="Cari kecamatan atau desa…" aria-label="Cari"><div id="list"></div><footer>Dibuat oleh <b>Muhammad Fazriansyah</b></footer></aside>

const mlbl=()=>{let t=0;for(let i=1;i<pts.length;i++)t+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);$('cur').textContent=pts.length>1?`Jarak: ${fmt(t,2)} km (${pts.length} titik)`:'Klik peta untuk menambah titik'};
function mdraw(){if(mline)G.remove(mline);mline=null;if(pts.length>1){mline=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map(p=>p.clone().setZ(p.z+.15))),new THREE.LineBasicMaterial({color:0xd4452f,depthTest:false}));mline.renderOrder=5;mline.raycast=()=>{};G.add(mline)}mlbl()}
$('bm').onclick=e=>{meas=!meas;e.target.classList.toggle('on',meas);if(meas)mlbl()};$('bc').onclick=()=>{pts=[];mdraw();$('cur').textContent='Pengukuran dihapus'};
$('bx').onclick=()=>{const ks=sel>=0?[K[sel]]:K,gj={type:'FeatureCollection',features:ks.map(k=>({type:'Feature',properties:{kode:k.c,nama:k.n,luas_km2:k.a,desa:k.nd},geometry:{type:'MultiPolygon',coordinates:k.r.map(r=>[r.map(p=>[+(p[0]/kx+LON0).toFixed(5),+(p[1]/ky+LAT0).toFixed(5)])])}}))};
 info.insertAdjacentHTML('beforeend','<textarea id="gj" readonly></textarea>');const t=$('gj');t.value=JSON.stringify(gj);t.select();try{document.execCommand('copy')}catch(_){}info.scrollTop=info.scrollHeight};
$('dst').onchange=e=>dlines.forEach(l=>l.visible=e.target.checked);
const cmpAdd=i=>{if(cmp.length>=2||cmp.includes(i))cmp=[];cmp.push(i);cmpShow();paint()};
function cmpShow(){const[a,b]=cmp.map(i=>K[i]);if(!a){info.innerHTML='<h2>Bandingkan</h2><p class="note">Klik dua kecamatan di peta.</p>';return}
 const row=(l,f,hi=1)=>{const va=f(a),vb=b?f(b):null,w=b?(va===vb?0:((va>vb)===!!hi?1:2)):0;return `<tr><td>${l}</td><td style="${w==1?'font-weight:800':''}">${fmt(va,1)}</td><td style="${w==2?'font-weight:800':''}">${b?fmt(vb,1):'—'}</td></tr>`};
 info.innerHTML=`<h2>Bandingkan</h2><table style="width:100%;border-collapse:collapse"><tr><th></th><th style="color:#d4452f;text-align:left">${a.n}</th><th style="color:#2b6fd4;text-align:left">${b?b.n:'(pilih)'}</th></tr>${row('Luas km²',k=>k.a)}${row('Desa',k=>k.nd)}${row('Penduduk (ribu)',k=>X[k.n][1])}${row('Jiwa/km²',k=>X[k.n][1]*1000/k.a)}${row('Elevasi mdpl*',k=>X[k.n][0])}${row('Jarak episentrum km',k=>k.ep,0)}${row('Tetangga',k=>k.nb.length)}</table><p class="note">Tebal = lebih tinggi (jarak episentrum: lebih dekat). *Perkiraan.</p>`}
$('bp').onclick=e=>{cmpOn=!cmpOn;e.target.classList.toggle('on',cmpOn);cmp=[];if(cmpOn){meas=false;$('bm').classList.remove('on');cmpShow()}else overview();paint()};
$('xp').oninput=e=>{xf=+e.target.value;K.forEach(k=>k.ms.forEach(m=>m.position.set(k.cx*.25*xf,k.cy*.25*xf,0)));W.forEach(w=>{const k=K[w.ki];w.m.position.x=w.x+k.cx*.25*xf;w.m.position.y=w.y+k.cy*.25*xf})};
let ti=0;$('bu').onclick=e=>{if(tourT){clearInterval(tourT);tourT=0;e.target.classList.remove('on');return}e.target.classList.add('on');const go=()=>{pick(ti++%K.length);dist=70};go();tourT=setInterval(go,4000)};
$('bh').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark',c=n==='dark'?0xe4ece6:0x1d2b27;document.documentElement.dataset.theme=n;lineMat.color.set(c);dMat.color.set(c)};
if(matchMedia('(prefers-color-scheme:dark)').matches){lineMat.color.set(0xe4ece6);dMat.color.set(0xe4ece6)}
let me=null;$('bl').onclick=()=>{const s=$('cur');if(!navigator.geolocation){s.textContent='Lokasi tidak didukung perangkat ini';return}s.textContent='Mencari lokasi…';
 navigator.geolocation.getCurrentPosition(ps=>{const x=(ps.coords.longitude-LON0)*kx,y=(ps.coords.latitude-LAT0)*ky,d=D.find(d=>d.r.some(r=>inPoly(x,y,r)));
  if(me)G.remove(me);me=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0x2b6fd4,depthTest:false}));me.renderOrder=6;me.raycast=()=>{};
  const ki=d?K.findIndex(k=>k.c===d.c.slice(0,8)):-1;me.position.set(x,y,(ki>=0?K[ki].h:1)+1);G.add(me);
  if(d){pick(ki,d.i);s.textContent='Anda di Desa '+d.n+', Kec. '+K[ki].n}else s.textContent='Lokasi Anda di luar Kabupaten Cianjur';const nw=[...W].sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];s.textContent+=` · Wisata terdekat: ${nw.ic} ${nw.n} (${fmt(Math.hypot(nw.x-x,nw.y-y),1)} km)`},
 ()=>{s.textContent='Izin lokasi ditolak atau tidak tersedia di halaman ini'},{enableHighAccuracy:true,timeout:10000})};
// kamera
const cv=R.domElement,ptr=new Map(),tip=$('tip'),ray=new THREE.Raycaster(),tgt=new THREE.Vector3();tgt.goal=new THREE.Vector3();let az=.35,el=.95,dist=150,d0=150,moved=0,pd=0;
function hit(e){const r=cv.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),C);return ray.intersectObjects(G.children,false)[0]}
const loc=h=>G.worldToLocal(h.point.clone());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);moved=0;if(ptr.size==2){const q=[...ptr.values()];pd=Math.hypot(q[0].clientX-q[1].clientX,q[0].clientY-q[1].clientY)}});
cv.addEventListener('pointerup',e=>{if(ptr.size==1&&moved<5){const h=hit(e);if(h&&h.object.userData.w!==undefined&&!meas){if(!cmpOn)wpick(h.object.userData.w)}else if(h){const p=loc(h);if(meas){pts.push(p);mdraw()}else if(cmpOn){cmpAdd(h.object.userData.i)}else{const i=h.object.userData.i;let di=-1;(ds[K[i].c]||[]).forEach(d=>{if(d.r.some(r=>inPoly(p.x-K[i].cx*.25*xf,p.y-K[i].cy*.25*xf,r)))di=d.i});pick(i,di)}}}ptr.delete(e.pointerId)});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);
 if(o){moved+=Math.abs(e.movementX)+Math.abs(e.movementY);ptr.set(e.pointerId,e);
  if(ptr.size==1){az-=(e.clientX-o.clientX)*.006;el=Math.max(.15,Math.min(1.55,el+(e.clientY-o.clientY)*.006))}
  else{const q=[...ptr.values()],n=Math.hypot(q[0].clientX-q[1].clientX,q[0].clientY-q[1].clientY);dist=Math.max(25,Math.min(320,dist*pd/n));pd=n}}
 else{const h=hit(e),hw=h&&h.object.userData.w,i=h&&h.object.userData.i!==undefined?h.object.userData.i:-1;if(i!==hov){hov=i;paint()}
  tip.style.display=i<0&&hw===undefined?'none':'block';if(h){const p=loc(h),r=box.getBoundingClientRect();tip.style.left=e.clientX-r.left+12+'px';tip.style.top=e.clientY-r.top+12+'px';tip.textContent=hw!==undefined?'📍 '+W[hw].n:K[i].n;
   if(!meas||!pts.length)$('cur').textContent=`${(p.y/ky+LAT0).toFixed(4)}, ${(p.x/kx+LON0).toFixed(4)}`}}});
cv.addEventListener('pointerleave',()=>{hov=-1;tip.style.display='none';paint()});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(25,Math.min(320,dist*(1+e.deltaY*.001)))},{passive:false});
const asd=document.querySelector('aside'),isMob=()=>matchMedia('(max-width:900px)').matches&&!matchMedia('(max-height:480px) and (orientation:landscape)').matches;let so=false;
function setSheet(o){so=!!o&&isMob();asd.classList.toggle('open',so);document.body.classList.toggle('so',so);size()}
$('hd').onclick=()=>setSheet(!so);$('bo').onclick=()=>$('opt').classList.toggle('show');
function size(){const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;if(so&&!isMob()){so=false;asd.classList.remove('open');document.body.classList.remove('so')}
 R.setSize(w,h,false);R.setPixelRatio(Math.min(devicePixelRatio,1.5));C.aspect=w/h;if(!size.s){size.s=1;d0=Math.min(240,150*Math.max(1,.66/C.aspect));dist=d0}
 if(so)C.setViewOffset(w,h,0,h*.22,w,h);else C.clearViewOffset();C.updateProjectionMatrix();dirty=3}
new ResizeObserver(size).observe(box);size();heights();overview();renderList();paint();
cv.addEventListener('pointerdown',()=>{if(tourT)$('bu').click();$('opt').classList.remove('show')});
const v=new THREE.Vector3(),lbt=$('lbt');
['click','input','change','wheel','pointermove','pointerdown','pointerup'].forEach(ev=>addEventListener(ev,()=>dirty=3,true));
(function loop(){if(tgt.distanceTo(tgt.goal)>.01)dirty=3;tgt.lerp(tgt.goal,.08);C.position.set(tgt.x+dist*Math.sin(az)*Math.cos(el),dist*Math.sin(el),tgt.z+dist*Math.cos(az)*Math.cos(el));C.lookAt(tgt);
 if(dirty>0){dirty--;R.render(S,C);const w=box.clientWidth,h=box.clientHeight;
 K.forEach(k=>{k.lb.style.display=lbt.checked?'':'none';if(!lbt.checked)return;v.set(k.cx*(1+.25*xf),k.cy*(1+.25*xf),k.h);G.localToWorld(v);v.project(C);k.lb.style.left=(v.x+1)/2*w+'px';k.lb.style.top=(1-v.y)/2*h+'px'}); W.forEach(q=>{const vis=$('wt').checked&&(ft==='*'||q.j===ft);q.b.style.display=vis?'':'none';if(!vis)return;v.copy(q.m.position);G.localToWorld(v);v.project(C);q.b.style.left=(v.x+1)/2*w+'px';q.b.style.top=(1-v.y)/2*h+'px'})}
 requestAnimationFrame(loop)})();
